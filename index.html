
<script>
// ITALIAN FOOTBALL MANAGER 2027 - MERCATO VERSIONE 0.9

let market = null;

function marketValue(p){
  const ageFactor = p.age <= 21 ? 1.35 : p.age <= 25 ? 1.2 : p.age <= 29 ? 1 : p.age <= 32 ? 0.75 : 0.5;
  return Math.round((p.overall * p.overall * 180 * ageFactor) / 1000) * 1000;
}

function initMarket(){
  market = {
    budget: 500000,
    transfers: [],
    offers: [],
    listings: []
  };
  generateMarketPlayers();
}

function generateMarketPlayers(){
  if(!market) return;
  market.listings = [];
  const roles = [
    ["POR","Portiere"],["DIF","Difensore"],
    ["CEN","Centrocampista"],["ATT","Attaccante"]
  ];
  for(let i=0;i<24;i++){
    const role = roles[Math.floor(Math.random()*roles.length)];
    const age = 18+Math.floor(Math.random()*17);
    const overall = 48+Math.floor(Math.random()*29);
    const p = {
      id:"M"+Date.now()+i,
      name:firstNames[Math.floor(Math.random()*firstNames.length)]+" "+
        lastNames[Math.floor(Math.random()*lastNames.length)],
      role:role[0], position:role[1], age,
      overall,
      potential:Math.min(90,overall+Math.floor(Math.random()*18)),
      wage:350+overall*32+Math.floor(Math.random()*250)
    };
    p.value=marketValue(p);
    market.listings.push(p);
  }
}

const oldSaveGame = saveGame;
window.saveGame = function(){
  oldSaveGame();
  if(!market) return;
  const raw=localStorage.getItem("ifm2027_save");
  if(!raw) return;
  const data=JSON.parse(raw);
  data.market=market;
  localStorage.setItem("ifm2027_save",JSON.stringify(data));
};

const oldStartCareer = startCareer;
window.startCareer = function(){
  oldStartCareer();
  initMarket();
  saveGame();
};

const oldLoadCareer = loadCareer;
window.loadCareer = function(){
  const raw=localStorage.getItem("ifm2027_save");
  if(!raw){
    oldLoadCareer();
    return;
  }
  try{
    const data=JSON.parse(raw);
    market=data.market || null;
  }catch(e){
    market=null;
  }
  oldLoadCareer();
  if(selectedClub && players.length){
    if(!market) initMarket();
    saveGame();
  }
};

function openMarket(){
  if(!market) initMarket();
  renderMarket();
  show("market");
}

function renderMarket(){
  document.getElementById("marketBudget").textContent=
    "Budget disponibile: €"+market.budget.toLocaleString("it-IT");

  const wageBill=players.reduce((sum,p)=>sum+(Number(p.wage)||0),0);
  document.getElementById("marketWages").textContent=
    "Monte stipendi mensile: €"+wageBill.toLocaleString("it-IT");

  const filter=document.getElementById("marketRole").value;
  const maxAge=Number(document.getElementById("marketAge").value)||99;
  const minRating=Number(document.getElementById("marketRating").value)||0;
  const area=document.getElementById("marketPlayers");
  area.innerHTML="";

  market.listings
    .filter(p=>(filter==="Tutti"||p.role===filter)&&p.age<=maxAge&&p.overall>=minRating)
    .sort((a,b)=>b.overall-a.overall)
    .forEach(p=>{
      const card=document.createElement("div");
      card.className="player";
      const info=document.createElement("div");
      const name=document.createElement("strong");
      name.textContent=p.name;
      const details=document.createElement("p");
      details.textContent=p.position+" · "+p.age+" anni · Potenziale "+p.potential;
      const price=document.createElement("p");
      price.textContent="Valore: €"+p.value.toLocaleString("it-IT")+" · Ingaggio €"+p.wage.toLocaleString("it-IT")+"/mese";
      info.append(name,details,price);

      const right=document.createElement("div");
      right.style.textAlign="center";
      const rating=document.createElement("div");
      rating.className="rating";
      rating.textContent=p.overall;
      const buy=document.createElement("button");
      buy.textContent="ACQUISTA";
      buy.style.width="100px";
      buy.onclick=()=>buyPlayer(p.id);
      right.append(rating,buy);
      card.append(info,right);
      area.append(card);
    });

  renderSales();
  renderOffers();
}

function buyPlayer(id){
  const p=market.listings.find(x=>x.id===id);
  if(!p)return;
  if(market.budget<p.value){
    alert("Budget insufficiente!");
    return;
  }
  if(players.length>=25){
    const rolePlayers=players.filter(x=>x.role===p.role);
    if(!rolePlayers.length){
      alert("Non puoi sostituire un giocatore di questo ruolo.");
      return;
    }
    const weakest=rolePlayers.sort((a,b)=>a.overall-b.overall)[0];
    if(!confirm("La rosa è al completo. Vuoi sostituire "+weakest.name+" con "+p.name+"?"))return;
    if(lineup.includes(weakest.id)){
      const index=lineup.indexOf(weakest.id);
      lineup[index]=p.id;
    }
    players=players.filter(x=>x.id!==weakest.id);
  }
  players.push({...p,id:Date.now()+Math.floor(Math.random()*1000)});
  market.budget-=p.value;
  market.transfers.unshift("Acquistato "+p.name+" per €"+p.value.toLocaleString("it-IT"));
  market.listings=market.listings.filter(x=>x.id!==id);
  saveGame();
  renderMarket();
  alert("Acquisto completato!");
}

function sellPlayer(id){
  const p=players.find(x=>x.id===id);
  if(!p)return;
  if(players.length<=11){
    alert("Devi mantenere almeno 11 calciatori in rosa.");
    return;
  }
  const value=Math.round(marketValue(p)*0.7);
  if(!confirm("Vendere "+p.name+" per €"+value.toLocaleString("it-IT")+"?"))return;

  players=players.filter(x=>x.id!==id);
  lineup=lineup.map(x=>x===id?null:x);
  market.budget+=value;
  market.transfers.unshift("Ceduto "+p.name+" per €"+value.toLocaleString("it-IT"));
  saveGame();
  renderMarket();
  alert("Cessione completata!");
}

function renderSales(){
  const area=document.getElementById("marketSales");
  area.innerHTML="";
  players.forEach(p=>{
    const d=document.createElement("div");
    d.className="player";
    const info=document.createElement("div");
    info.innerHTML="<strong></strong><p></p>";
    info.children[0].textContent=p.name;
    info.children[1].textContent=p.position+" · "+p.age+" anni · Valore €"+marketValue(p).toLocaleString("it-IT");
    const b=document.createElement("button");
    b.textContent="VENDI";
    b.style.width="85px";
    b.onclick=()=>sellPlayer(p.id);
    d.append(info,b);
    area.append(d);
  });
}

function generateOffers(){
  const candidates=players.filter(p=>!market.offers.some(o=>o.playerId===p.id));
  if(!candidates.length){
    alert("Non ci sono nuovi giocatori disponibili per le offerte.");
    return;
  }
  const p=candidates[Math.floor(Math.random()*candidates.length)];
  const value=Math.round(marketValue(p)*(0.85+Math.random()*0.5));
  const clubs=["Real Milano","Atletico Roma","Sporting Napoli","Union Torino","Pro Firenze"];
  market.offers.unshift({
    playerId:p.id,
    playerName:p.name,
    club:clubs[Math.floor(Math.random()*clubs.length)],
    value,
    wage:p.wage
  });
  saveGame();
  renderOffers();
}

function renderOffers(){
  const area=document.getElementById("marketOffers");
  area.innerHTML="";
  if(!market.offers.length){
    area.textContent="Nessuna offerta ricevuta.";
    return;
  }
  market.offers.forEach((o,index)=>{
    const d=document.createElement("div");
    d.className="panel";
    const title=document.createElement("strong");
    title.textContent=o.club+" offre per "+o.playerName;
    const detail=document.createElement("p");
    detail.className="small";
    detail.textContent="Offerta: €"+o.value.toLocaleString("it-IT");
    const accept=document.createElement("button");
    accept.textContent="ACCETTA";
    accept.onclick=()=>acceptOffer(index);
    const reject=document.createElement("button");
    reject.className="secondary";
    reject.textContent="RIFIUTA";
    reject.onclick=()=>{
      market.offers.splice(index,1);
      saveGame();
      renderOffers();
    };
    d.append(title,detail,accept,reject);
    area.append(d);
  });
}

function acceptOffer(index){
  const o=market.offers[index];
  const p=players.find(x=>x.id===o.playerId);
  if(!p){
    market.offers.splice(index,1);
    saveGame();
    renderOffers();
    return;
  }
  if(players.length<=11){
    alert("Non puoi scendere sotto gli 11 calciatori.");
    return;
  }
  players=players.filter(x=>x.id!==p.id);
  lineup=lineup.map(x=>x===p.id?null:x);
  market.budget+=o.value;
  market.transfers.unshift("Venduto "+p.name+" a "+o.club+" per €"+o.value.toLocaleString("it-IT"));
  market.offers.splice(index,1);
  saveGame();
  renderMarket();
  alert("Offerta accettata!");
}

function showTransfers(){
  const area=document.getElementById("marketHistory");
  area.innerHTML="";
  market.transfers.forEach(t=>{
    const p=document.createElement("p");
    p.className="small";
    p.textContent="• "+t;
    area.append(p);
  });
  if(!market.transfers.length)area.textContent="Nessun trasferimento effettuato.";
}

function installMarket(){
  const section=document.createElement("section");
  section.id="market";
  section.className="hidden";
  section.innerHTML=`
    <div class="hero">
      <span class="tag">MERCATO 2026/2027</span>
      <h2>CALCIOMERCATO</h2>
      <p id="marketBudget"></p>
      <p id="marketWages"></p>
    </div>
    <div class="panel">
      <h3>Ricerca calciatori</h3>
      <label>Ruolo</label>
      <select id="marketRole">
        <option value="Tutti">Tutti</option>
        <option value="POR">Portieri</option>
        <option value="DIF">Difensori</option>
        <option value="CEN">Centrocampisti</option>
        <option value="ATT">Attaccanti</option>
      </select>
      <label>Età massima</label>
      <select id="marketAge">
        <option value="99">Tutte le età</option>
        <option value="21">21 anni</option>
        <option value="25">25 anni</option>
        <option value="30">30 anni</option>
      </select>
      <label>Valutazione minima</label>
      <select id="marketRating">
        <option value="0">Tutte</option>
        <option value="55">55+</option>
        <option value="60">60+</option>
        <option value="65">65+</option>
        <option value="70">70+</option>
      </select>
      <button onclick="renderMarket()">CERCA</button>
    </div>
    <div class="panel">
      <h3>Giocatori disponibili</h3>
      <div id="marketPlayers"></div>
      <button class="secondary" onclick="generateMarketPlayers();renderMarket()">AGGIORNA LISTA</button>
    </div>
    <div class="panel">
      <h3>La tua rosa · Cessioni</h3>
      <div id="marketSales"></div>
    </div>
    <div class="panel">
      <h3>Offerte delle altre società</h3>
      <p class="small">Genera un'offerta da un'altra squadra per uno dei tuoi calciatori.</p>
      <button onclick="generateOffers()">RICEVI NUOVA OFFERTA</button>
      <div id="marketOffers"></div>
    </div>
    <div class="panel">
      <h3>Storico trasferimenti</h3>
      <div id="marketHistory"></div>
    </div>
    <button class="secondary" onclick="show('dashboard')">TORNA ALLA SOCIETÀ</button>
  `;
  document.querySelector("main").append(section);
}

installMarket();

const oldShowDashboard=showDashboard;
window.showDashboard=function(){
  oldShowDashboard();
  const nav=document.querySelector("#dashboard nav");
  if(!document.getElementById("marketButton")){
    const b=document.createElement("button");
    b.id="marketButton";
    b.textContent="MERCATO";
    b.onclick=openMarket;
    nav.append(b);
  }
};

const oldShowRoster=showRoster;
window.showRoster=function(){
  oldShowRoster();
  document.querySelector("#roster .hero strong").textContent=players.length+" CALCIATORI";
};
</script>
